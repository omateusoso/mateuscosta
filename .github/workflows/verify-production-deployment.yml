name: Verify production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify configured production URLs
    runs-on: ubuntu-latest
    steps:
      - name: Verify configured URLs
        env:
          SITE_URL: ${{ vars.MATEUSCOSTA_SITE_URL }}
          CRM_URL: ${{ vars.MATEUSCOSTA_CRM_URL }}
        run: |
          urls=("${SITE_URL}" "${CRM_URL}")
          checked=0
          for url in "${urls[@]}"; do
            if [[ -z "${url}" ]]; then
              continue
            fi
            curl --fail --show-error --silent --retry 4 --retry-all-errors --retry-delay 5 -H 'Cache-Control: no-cache' "${url}" > /dev/null
            checked=$((checked + 1))
          done
          if [[ "${checked}" -eq 0 ]]; then
            echo "No production URLs configured yet; set MATEUSCOSTA_SITE_URL and optionally MATEUSCOSTA_CRM_URL as GitHub repository variables."
          fi
